on:
  push:
    branches:
    - main
  release:
    types: [created]
name: Deploy to Amazon ECS
jobs:
  deploy:
    name: Deploy-test
    runs-on: self-hosted
    environment: Production
    steps:
    - name: Show Working directory
      run: pwd  
    - name: Show Working directory
      run: ls -la  
    - name: Checkout
      uses: actions/checkout@v2
    - name: Show Working directory
      run: ls -ltr  
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
    - name: Build, tag, and push elearning  admin nginx image to Amazon ECR
      id: build-nginxadmin-elearning-id
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: vss-images
        IMAGE_TAG: vcp-ide-nginx-img
      run: |
        ls -ltr
        cd nginx
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    - name: Build, tag, and push elearning admin image to Amazon ECR
      id: build-elearningadmin-id
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: vss-images
        IMAGE_TAG: vcp-ide-img
      run: |
        ls -ltr
        cd scripts
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    
