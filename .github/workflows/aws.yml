name: Build And Push IDE Image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG: latest

jobs:
  build-and-push:
    name: Build And Push To ECR
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Validate required configuration
        shell: bash
        run: |
          test -n "${AWS_REGION}" || { echo "AWS_REGION is required"; exit 1; }
          test -n "${ECR_REGISTRY}" || { echo "Set repository variable ECR_REGISTRY"; exit 1; }
          test -n "${ECR_REPOSITORY}" || { echo "Set repository variable ECR_REPOSITORY"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build --no-cache \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}" \
            .
          echo "SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_ENV}"

      - name: Push image
        shell: bash
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
          echo "Images pushed:"
          echo " - ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo " - ${ECR_REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"

      - name: Update ECS service
        if: ${{ vars.ECS_CLUSTER != '' && vars.ECS_SERVICE != '' }}
        shell: bash
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment
