<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&amp;display=swap');
      
      .logo-text {
        font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
        font-size: 130px;
        font-weight: 800;
        fill: #080808; /* Very dark, almost black text */
      }
    </style>

    <pattern id="checkerboard" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#222222" />
      <rect x="12" width="12" height="12" fill="#181818" />
      <rect y="12" width="12" height="12" fill="#181818" />
      <rect x="12" y="12" width="12" height="12" fill="#222222" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#1f1f1f" />

  <rect x="150" y="80" width="500" height="140" fill="url(#checkerboard)" />

  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" class="logo-text" letter-spacing="4">
    JUDGE0
  </text>
  
  <circle cx="583" cy="144" r="8" fill="#080808" />
</svg>